name: Writeup-Readme

on:
  push:
    branches: 
      - 'main'
    paths:
      - 'writeup.pdf'
      - '.README.md'
      - '.github/workflows/writeup_readme.yml'

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      ORPHAN_BRANCH: readme_images
      QUALITY: 85
      DPI: 250
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        fetch-depth: 0

    ## INSTALL DELEGATES SILENTLY WITHOUT PROMPTS
    - name: Install Ghostscript and Poppler Utilities
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo apt-get install -y -q --no-install-recommends ghostscript poppler-utils imagemagick
        
        # Overwrite the security policy configuration blocking PDF extraction
        sudo sed -i 's/domain="coder" rights="none" pattern="PDF"/domain="coder" rights="read|write" pattern="PDF"/' /etc/ImageMagick-6/policy.xml || true
        sudo sed -i 's/domain="coder" rights="none" pattern="PDF"/domain="coder" rights="read|write" pattern="PDF"/' /etc/ImageMagick-7/policy.xml || true

    ## EXTRACT AND CONVERT IMAGES NATIVELY
    - name: Convert Writeup to Images
      run: |
        pdftoppm -png -r ${{env.DPI}} writeup.pdf output
        
        # Compress the extracted PNGs into clean portfolio JPG assets
        for f in output-*.png; do
          if [ -f "$f" ]; then
            convert "$f" -trim -colorspace sRGB -alpha remove -quality ${{env.QUALITY}} "${f%.png}.jpg"
            rm "$f"
          fi
        done

    ## COMMIT THEM TO AN ORPHAN BRANCH
    - name: Commit images to orphan branch
      run: | 
        git checkout --orphan ${{env.ORPHAN_BRANCH}}
        touch .README.md
        mv .README.md .README.temp
        git rm -rf . --cached || true
        rm -rf *
        git add *.jpg || true
        git config --local user.email "action@github.com"
        git config --local user.name "GithubActions"
        git commit -m "Updated writeup images" -a || echo "No image changes to commit"
        
    - name: Push images to orphan branch
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        branch: ${{ env.ORPHAN_BRANCH }}
        force: true

    ## REBUILD OVERVIEW PAGE
    - name: Update Readme
      id: main
      run: |
        echo $'\n' >> .README.temp
        for filename in *.jpg; do \
          echo '!(https://github.com{{env.ORPHAN_BRANCH}}/'$filename'?raw=true)' >> .README.temp;  \
        done
        git checkout main
        rm -f README.md
        mv .README.temp README.md
        
        if git diff --exit-code README.md; then
          echo "changed=0" >> "$GITHUB_OUTPUT"
        else
          echo "changed=1" >> "$GITHUB_OUTPUT"
        fi
        
    - name: Commit new README (if changed)
      if: steps.main.outputs.changed == '1'
      run: |
        git add README.md
        git config --local user.email "action@github.com"
        git config --local user.name "GithubActions"
        git commit -m "Updated Readme" -a
        
    - name: Push changes
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        branch: main
