name: Writeup-Readme

on:
  push:
    branches: 
      - 'main'
    paths:
      - 'writeup.pdf'
      - '.README.md'
      - '.github/workflows/writeup_readme.yml'

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      ORPHAN_BRANCH: readme_images
      QUALITY: 85
      DPI: 250
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        fetch-depth: 0

    ## INSTALL DELEGATES FOR PDF CONVERSION
    - name: Install Ghostscript and Poppler Utilities
      run: |
        sudo apt-get update
        sudo apt-get install -y ghostscript poppler-utils imagemagick
        
        # Fix Ubuntu security policy that blocks ImageMagick from reading PDFs
        sudo sed -i 's/domain="coder" rights="none" pattern="PDF"/domain="coder" rights="read|write" pattern="PDF"/' /etc/ImageMagick-6/policy.xml

    ## CONVERT THE ACTUAL IMAGES USING NATIVE TOOLS
    - name: Convert Writeup to Images
      run: |
        pdftoppm -png -r ${{env.DPI}} writeup.pdf output
        
        # Convert output PNGs to compressed JPGs using native ImageMagick
        for f in output-*.png; do
          convert "$f" -trim -colorspace sRGB -alpha remove -quality ${{env.QUALITY}} "${f%.png}.jpg"
          rm "$f"
        done

    ## COMMIT THEM TO AN ORPHAN BRANCH
    - name: Commit images to orphan branch
      run: | 
        git checkout --orphan ${{env.ORPHAN_BRANCH}}
        touch .README.md
        mv .README.md .README.temp
        git rm -rf .
        git add *.jpg
        git config --local user.email "action@github.com"
        git config --local user.name "GithubActions"
        git commit -m "Updated writeup images" -a
    - name: Push images to orphan branch
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        branch: ${{ env.ORPHAN_BRANCH }}
        force: true

    ## UPDATE README IN BRANCH IF IT NEEDS TO BE UPDATED
    - name: Update Readme
      id: main
      run: |
        echo $'\n' >> .README.temp
        for filename in *.jpg; do \
          echo '!(https://github.com{{env.ORPHAN_BRANCH}}/'$filename'?raw=true)' >> .README.temp;  \
        done
        git checkout ${{ github.ref }}
        rm -f README.md
        mv .README.temp README.md
        
        if git diff --exit-code README.md; then
          echo "changed=0" >> "$GITHUB_OUTPUT"
        else
          echo "changed=1" >> "$GITHUB_OUTPUT"
        fi
        
    - name: Commit new README (if changed)
      if: steps.main.outputs.changed == '1'
      run: |
        git add README.md
        git config --local user.email "action@github.com"
        git config --local user.name "GithubActions"
        git commit -m "Updated Readme" -a
        
    - name: Push changes
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        branch: ${{ github.ref }}
