name: Writeup-Readme

on:
  push:
    branches: 
      - 'main'
    paths:
      - 'writeup.pdf'
      - '.README.md'
      - '.github/workflows/writeup_readme.yml'

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      ORPHAN_BRANCH: readme_images
      QUALITY: 85
      DPI: 250
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        fetch-depth: 0

    ## INSTALL DELEGATES SILENTLY WITHOUT PROMPTS
    - name: Install Ghostscript and Poppler Utilities
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo apt-get install -y -q --no-install-recommends ghostscript poppler-utils imagemagick
        
        # Overwrite security policies blocking PDF manipulation
        sudo sed -i 's/domain="coder" rights="none" pattern="PDF"/domain="coder" rights="read|write" pattern="PDF"/' /etc/ImageMagick-6/policy.xml || true
        sudo sed -i 's/domain="coder" rights="none" pattern="PDF"/domain="coder" rights="read|write" pattern="PDF"/' /etc/ImageMagick-7/policy.xml || true

    ## EXTRACT AND CONVERT IMAGES TO A TEMPORARY FOLDER
    - name: Convert Writeup to Images
      run: |
        mkdir -p /tmp/artifacts
        
        # Save baseline README if it exists
        if [ -f ".README.md" ]; then
          cp .README.md /tmp/artifacts/.README.md
        fi
        
        # Convert PDF pages to PNG
        pdftoppm -png -r ${{env.DPI}} writeup.pdf /tmp/artifacts/page
        
        # Convert PNGs to optimized JPGs
        for f in /tmp/artifacts/page-*.png; do
          if [ -f "$f" ]; then
            convert "$f" -trim -colorspace sRGB -alpha remove -quality ${{env.QUALITY}} "${f%.png}.jpg"
            rm "$f"
          fi
        done

    ## COMMIT AND PUSH IMAGES TO THE ORPHAN BRANCH
    - name: Push images to orphan branch
      run: | 
        git checkout --orphan ${{env.ORPHAN_BRANCH}}
        git rm -rf . --cached || true
        rm -rf *
        
        # Bring back the generated JPG images safely
        cp /tmp/artifacts/page-*.jpg .
        
        git config --local user.email "action@github.com"
        git config --local user.name "GithubActions"
        git add *.jpg
        git commit -m "Updated writeup images"
        
    - name: Push orphan branch refs
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        branch: ${{ env.ORPHAN_BRANCH }}
        force: true

    ## REBUILD OVERVIEW PAGE ON MAIN BRANCH
    - name: Update Readme on Main
      id: readme_step
      run: |
        git checkout main
        
        # Start constructing the new README content
        rm -f README.md
        touch README.md
        
        # Append baseline text if it existed
        if [ -f "/tmp/artifacts/.README.md" ]; then
          cat /tmp/artifacts/.README.md >> README.md
          echo $'\n' >> README.md
        fi
        
        # Generate markdown image handles dynamically based on files in /tmp/artifacts
        for filepath in /tmp/artifacts/page-*.jpg; do
          if [ -f "$filepath" ]; then
            filename=$(basename "$filepath")
            echo "!image" >> README.md
          fi
        done
        
        if git diff --exit-code README.md; then
          echo "changed=0" >> "$GITHUB_OUTPUT"
        else
          echo "changed=1" >> "$GITHUB_OUTPUT"
        fi
        
    - name: Commit new README (if changed)
      if: steps.readme_step.outputs.changed == '1'
      run: |
        git add README.md
        git config --local user.email "action@github.com"
        git config --local user.name "GithubActions"
        git commit -m "Updated Readme with writeup links" -a
        
    - name: Push changes to main
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        branch: main
